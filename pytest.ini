[pytest]
# Test modules insert `backend/` onto sys.path themselves and import as `app.*`,
# so no rootdir-level pythonpath/src-layout config is required — just point
# pytest at the directory.
testpaths = backend/tests

markers =
    live_service: requires a live external service (Hermes gateway on :8642,
        Voicebox on :17493, or Google OAuth credentials) that is not present
        on a cloud/CI VM. Run these only on the desk machine where those
        services are actually running; see backend/tests/README.md.

# Keep pytest's own cache out of the repo tree it is scanning.
cache_dir = /tmp/.pytest_cache
